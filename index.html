<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e9">
  <meta name="description" content="2026 快樂公司員工旅遊河內行活動報名">
  <title>2026 快樂公司員工旅遊河內行</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');

    :root {
      color-scheme: light;
      --ink: #20363a;
      --muted: #647779;
      --paper: #fffaf0;
      --white: #ffffff;
      --coral: #e85f43;
      --coral-dark: #c94b34;
      --teal: #16877e;
      --yellow: #f5c64c;
      --line: #e6e2d6;
      --shadow: 0 16px 42px rgba(32, 54, 58, 0.09);
      font-family: 'DM Sans', 'Noto Sans TC', sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(22, 135, 126, .12) .8px, transparent .8px);
      background-size: 19px 19px;
    }
    main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 38px 0 72px; }
    .page-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 82px;
      margin: 0 0 24px;
      text-align: center;
      font-size: clamp(25px, 4vw, 40px);
      line-height: 1.25;
      font-weight: 900;
    }
    .title-mark { width: 10px; height: 40px; flex: 0 0 10px; border-radius: 6px; background: var(--coral); transform: rotate(7deg); }
    .poster-frame { overflow: hidden; border: 5px solid var(--white); border-radius: 18px; box-shadow: var(--shadow); }
    .poster-frame img { display: block; width: 100%; height: auto; }
    .content-row { display: grid; grid-template-columns: minmax(0, .92fr) minmax(360px, 1.08fr); gap: 44px; margin-top: 40px; align-items: start; }
    .section-heading { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; font-size: 25px; line-height: 1.3; font-weight: 800; }
    .section-heading span { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; color: var(--white); background: var(--teal); font-size: 17px; }
    .schedule { position: relative; margin: 0; padding: 0 0 0 8px; list-style: none; }
    .schedule::before { position: absolute; top: 11px; bottom: 11px; left: 67px; width: 2px; content: ''; background: #d7e5df; }
    .schedule li { position: relative; display: grid; grid-template-columns: 61px 1fr; gap: 20px; padding: 0 0 24px; align-items: baseline; }
    .schedule li::before { position: absolute; top: 7px; left: 55px; width: 10px; height: 10px; border: 3px solid var(--paper); border-radius: 50%; background: var(--coral); content: ''; box-shadow: 0 0 0 2px var(--coral); }
    .schedule time { color: var(--teal); font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .schedule p { margin: 0; font-size: 16px; line-height: 1.6; font-weight: 600; }
    .signup { padding: 27px 30px 30px; border: 1px solid rgba(32, 54, 58, .08); border-radius: 12px; background: var(--white); box-shadow: var(--shadow); }
    .signup .section-heading { margin-bottom: 5px; }
    .required-note { margin: 0 0 22px 50px; color: var(--muted); font-size: 13px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 14px; font-weight: 700; }
    label .required { color: var(--coral); }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #d8dfda; border-radius: 6px; outline: none; color: var(--ink); background: #fffefa; font: inherit; font-size: 15px; transition: border-color .16s, box-shadow .16s; }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22, 135, 126, .14); }
    input::placeholder { color: #a0acab; }
    .submit-button { display: flex; min-height: 49px; width: 100%; margin-top: 20px; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 6px; color: var(--white); background: var(--coral); font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: background .16s, transform .16s; }
    .submit-button:hover { background: var(--coral-dark); transform: translateY(-1px); }
    .submit-button:disabled { opacity: .65; cursor: wait; transform: none; }
    .submit-button svg { width: 18px; height: 18px; }
    .form-status { min-height: 22px; margin: 12px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
    .form-status[data-state='success'] { color: var(--teal); }
    .form-status[data-state='error'] { color: var(--coral-dark); }
    .footer-note { margin: 38px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

    @media (max-width: 760px) {
      main { width: min(100% - 30px, 560px); padding-top: 23px; }
      .page-title { min-height: 66px; gap: 10px; margin-bottom: 18px; font-size: 26px; }
      .title-mark { width: 7px; height: 32px; flex-basis: 7px; }
      .poster-frame { border-width: 3px; border-radius: 12px; }
      .content-row { grid-template-columns: 1fr; gap: 28px; margin-top: 31px; }
      .section-heading { margin-bottom: 18px; font-size: 22px; }
      .schedule li { padding-bottom: 20px; }
      .signup { padding: 23px 20px 24px; }
    }
    @media (max-width: 420px) {
      .page-title { font-size: 22px; }
      .form-grid { grid-template-columns: 1fr; gap: 14px; }
      .field.full { grid-column: auto; }
      .schedule { padding-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header class="page-title"><span class="title-mark" aria-hidden="true"></span><h1>2026 快樂公司員工旅遊河內行</h1></header>

    <section class="poster-frame" aria-label="河內旅遊活動海報">
      <img src="旅遊海報1.jpg" alt="快樂公司員工旅遊河內行，12月15日至12月18日，越南河內" fetchpriority="high">
    </section>

    <div class="content-row">
      <section aria-labelledby="schedule-title">
        <h2 class="section-heading" id="schedule-title"><span aria-hidden="true">01</span>行程安排</h2>
        <ol class="schedule">
          <li><time datetime="08:00">08:00</time><p>機場集合</p></li>
          <li><time datetime="10:30">10:30</time><p>平安順飛</p></li>
          <li><time datetime="12:40">12:40</time><p>安全抵達</p></li>
          <li><time datetime="14:00">14:00</time><p>飯店大廳集合</p></li>
          <li><time datetime="15:00">15:00</time><p>老城探索（自由活動）</p></li>
          <li><time datetime="18:00">18:00</time><p>晚餐在越美麗餐廳享用</p></li>
        </ol>
      </section>

      <section class="signup" aria-labelledby="signup-title">
        <h2 class="section-heading" id="signup-title"><span aria-hidden="true">02</span>立即報名</h2>
        <p class="required-note"><span class="required" aria-hidden="true">*</span> 為必填欄位</p>
        <form id="signup-form">
          <div class="form-grid">
            <div class="field">
              <label for="name">姓名 <span class="required">*</span></label>
              <input id="name" name="name" autocomplete="name" placeholder="請輸入姓名" required>
            </div>
            <div class="field">
              <label for="email">Email <span class="required">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
            </div>
            <div class="field">
              <label for="department">單位</label>
              <input id="department" name="department" autocomplete="organization" placeholder="請輸入單位">
            </div>
            <div class="field">
              <label for="phone">電話 <span class="required">*</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="例如 0912-345-678" required>
            </div>
            <div class="field full">
              <label for="title">職稱</label>
              <input id="title" name="title" autocomplete="organization-title" placeholder="請輸入職稱">
            </div>
          </div>
          <button class="submit-button" type="submit">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            送出報名
          </button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
    <p class="footer-note">2026 快樂公司員工旅遊 · 河內</p>
  </main>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3HdYOAZYbK3bcVk5Pc1odw_Ztx4U9V9kUrjrbK5aZSbESaQoVOen14yPwVKh6w_nx/exec';
    const signupForm = document.querySelector('#signup-form');
    const submitButton = signupForm.querySelector('button[type="submit"]');
    const formStatus = document.querySelector('#form-status');

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!SCRIPT_URL) {
        formStatus.dataset.state = 'error';
        formStatus.textContent = '報名系統尚未完成設定，請稍後再試。';
        return;
      }

      submitButton.disabled = true;
      formStatus.dataset.state = '';
      formStatus.textContent = '資料送出中…';
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams(new FormData(signupForm))
        });
        formStatus.dataset.state = 'success';
        formStatus.textContent = '報名資料已送出，謝謝！';
        signupForm.reset();
      } catch (error) {
        formStatus.dataset.state = 'error';
        formStatus.textContent = '送出失敗，請檢查網路後再試一次。';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
